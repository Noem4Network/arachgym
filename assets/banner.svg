<svg xmlns="http://www.w3.org/2000/svg" width="660" height="190" viewBox="0 0 660 190" role="img" aria-label="ArachGym — privacy-first gym &amp; workout tracker by ArachTech.am">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1C23"/>
      <stop offset="100%" stop-color="#121318"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF851A"/>
      <stop offset="100%" stop-color="#FF6D00"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33EBFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="660" height="190" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="657" height="187" rx="20.5" fill="none" stroke="#2A2D38" stroke-width="2"/>

  <!-- Stylized ArachGym Geometric Emblem 'A' + Dumbbell -->
  <g transform="translate(105, 95) scale(0.95)">
    <!-- Right leg / Cyan diagonal -->
    <path d="M-5,-42 L18,-42 L42,38 L16,38 Z" fill="url(#cyanGrad)"/>
    <!-- Left leg / Orange chevron arrow pointing upward -->
    <path d="M-18,-42 L-40,8 L-16,8 L-28,38 L-48,8 L-55,-12 Z" fill="url(#orangeGrad)"/>
    <path d="M-35,-42 L-10,-42 L-28,-14 Z" fill="#FF851A"/>
    <!-- Horizontal Dumbbell bar & weights -->
    <rect x="-65" y="-7" width="130" height="14" rx="4" fill="#374151" stroke="#111827" stroke-width="1.5"/>
    <!-- Left weight plates (Orange accent) -->
    <rect x="-72" y="-22" width="12" height="44" rx="3" fill="#FF6D00"/>
    <rect x="-82" y="-16" width="8" height="32" rx="2" fill="#E65100"/>
    <!-- Right weight plates (Cyan accent) -->
    <rect x="60" y="-22" width="12" height="44" rx="3" fill="#00E5FF"/>
    <rect x="74" y="-16" width="8" height="32" rx="2" fill="#00B4D8"/>
  </g>

  <!-- Wordmark + Tagline -->
  <text x="215" y="85" font-family="'Montserrat', -apple-system, Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    <tspan fill="#FFFFFF">Arach</tspan><tspan fill="#00E5FF">Gym</tspan>
  </text>
  <text x="218" y="120" font-family="'Roboto', -apple-system, sans-serif" font-size="18" font-weight="500" fill="#9CA3AF">
    Privacy-first fitness platform by <tspan fill="#FF6D00" font-weight="700">ArachTech.am</tspan>
  </text>
  <text x="218" y="146" font-family="'Roboto', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#6B7280" letter-spacing="0.5">
    LOCAL EXERCISE POOL  •  OFFLINE-READY  •  PASSKEY LOGIN
  </text>
</svg>
